name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag from FastTransfer (ex: v0.28.0)'
        required: true
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 3:00 AM UTC

jobs:
  build-and-push:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get versions to build
        id: versions
        run: |
          # Get all existing tags from Docker Hub
          ALL_VERSIONS=$(curl -s "https://hub.docker.com/v2/repositories/arpeio/fasttransfer/tags/?page_size=100" | \
            jq -r '.results[].name' | grep '^v[0-9]' | sort -V)
          
          # Find the latest version of each minor branch (e.g., latest 0.28.x, 0.27.x, etc.)
          LATEST_PER_MINOR=$(echo "$ALL_VERSIONS" | \
            sed 's/v\([0-9]*\.[0-9]*\)\.[0-9]*/\1/' | \
            uniq | \
            while read minor; do
              echo "$ALL_VERSIONS" | grep "^v${minor}\." | tail -n 1
            done | tr '\n' ' ')
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled build: rebuilding latest of each minor branch"
            echo "Versions to rebuild: $LATEST_PER_MINOR"
            echo "versions=$LATEST_PER_MINOR" >> $GITHUB_OUTPUT
            echo "new_version=" >> $GITHUB_OUTPUT
          else
            echo "Manual build: building new version + latest of each minor branch"
            NEW_VERSION="${{ github.event.inputs.version }}"
            
            echo "New version: $NEW_VERSION"
            echo "Latest versions per minor branch to rebuild: $LATEST_PER_MINOR"
            
            echo "versions=$LATEST_PER_MINOR" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build and push all versions
        env:
          S3_BASE_PATH: ${{ secrets.AWS_S3_FASTTRANSFER_PATH }}
        run: |
          NEW_VERSION="${{ steps.versions.outputs.new_version }}"
          VERSIONS="${{ steps.versions.outputs.versions }}"
          FINGERPRINT_LABEL="io.arpe.build.fingerprint"

          # Download the FastTransfer binary of a version from S3 into ./FastTransfer
          download_binary() {
            FILE="FastTransfer-linux-x64-$1.zip"
            echo "Downloading ${FILE}..."
            aws s3 cp "${S3_BASE_PATH}${FILE}" FastTransfer.zip
            unzip -o FastTransfer.zip -d ./FastTransfer_extracted
            rm FastTransfer.zip
            mv -f ./FastTransfer_extracted/FastTransfer ./FastTransfer
            chmod +x ./FastTransfer
          }

          # Build a version locally and push it only if its content (installed
          # Debian packages + binary + Dockerfile) differs from the image already
          # on Docker Hub. Every push leaves the previous digest behind as an
          # untagged image, so pushing identical weekly rebuilds bloats the repo.
          build_and_push() {
            VERSION="$1"
            download_binary "$VERSION"

            # Local build first; the push build below reuses its layers
            docker buildx build \
              --load \
              --platform linux/amd64 \
              --tag fasttransfer-candidate:${VERSION} \
              --no-cache \
              --cache-to type=local,dest=/tmp/buildcache,mode=max \
              .

            FINGERPRINT=$( {
              docker run --rm --entrypoint dpkg-query fasttransfer-candidate:${VERSION} -W -f '${Package}=${Version}\n'
              sha256sum FastTransfer Dockerfile
            } | sha256sum | cut -d' ' -f1)

            PUBLISHED=$(docker buildx imagetools inspect arpeio/fasttransfer:${VERSION} --format '{{json .Image}}' 2>/dev/null | \
              jq -r --arg l "$FINGERPRINT_LABEL" '(if has("config") then . else .["linux/amd64"] end).config.Labels[$l] // empty' || true)

            if [ "$FINGERPRINT" = "$PUBLISHED" ]; then
              echo "⏭️  ${VERSION} unchanged since last push (fingerprint ${FINGERPRINT}), skipping"
            else
              echo "Content changed (published: '${PUBLISHED}', new: '${FINGERPRINT}'), pushing..."
              docker buildx build \
                --push \
                --platform linux/amd64 \
                --tag arpeio/fasttransfer:${VERSION} \
                --label ${FINGERPRINT_LABEL}=${FINGERPRINT} \
                --provenance=true \
                --sbom=true \
                --cache-from type=local,src=/tmp/buildcache \
                .
              echo "✅ Successfully built and pushed: ${VERSION}"
            fi

            # Cleanup
            docker rmi fasttransfer-candidate:${VERSION}
            rm -rf ./FastTransfer ./FastTransfer_extracted /tmp/buildcache
          }

          # Build/rebuild existing versions first (oldest to newest)
          for VERSION in $VERSIONS; do
            # Skip if this is the new version (will be built last)
            if [ "$VERSION" = "$NEW_VERSION" ]; then
              echo "Skipping $VERSION (will be built as new version at the end)"
              continue
            fi

            echo "================================================"
            echo "Building version: $VERSION"
            echo "================================================"

            S3_PATH="${S3_BASE_PATH}FastTransfer-linux-x64-${VERSION}.zip"
            echo "Checking if ${S3_PATH} exists..."
            if ! aws s3 ls "${S3_PATH}" >/dev/null 2>&1; then
              echo "⚠️  Warning: ${S3_PATH} not found, skipping..."
              continue
            fi

            build_and_push "$VERSION"
          done

          # Build the new version last (manual builds only)
          if [ -n "$NEW_VERSION" ]; then
            echo "================================================"
            echo "Building NEW version: $NEW_VERSION"
            echo "================================================"

            S3_PATH="${S3_BASE_PATH}FastTransfer-linux-x64-${NEW_VERSION}.zip"
            echo "Checking if ${S3_PATH} exists..."
            aws s3 ls "${S3_PATH}" >/dev/null

            build_and_push "$NEW_VERSION"
            LATEST_VERSION="$NEW_VERSION"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled builds: latest follows the most recent version
            LATEST_VERSION=$(echo "$VERSIONS" | tr ' ' '\n' | grep -v '^$' | tail -n 1)
          fi

          # Tag latest separately (re-pointing to an unchanged image creates no new digest)
          if [ -n "$LATEST_VERSION" ]; then
            echo "Tagging latest with ${LATEST_VERSION}..."
            docker buildx imagetools create \
              arpeio/fasttransfer:${LATEST_VERSION} \
              --tag arpeio/fasttransfer:latest
            echo "✅ Tagged as latest"
          else
            echo "⚠️  Warning: No version found to tag as latest"
          fi

      # - name: Smoke test
      #   run: |
      #     set -eux
      #     docker run --rm arpeio/fasttransfer:latest --version
      #     echo "✅ FastTransfer runs"

  keepalive:
    # GitHub auto-disables scheduled workflows after 60 days of no repository
    # activity, which silently stops the weekly rebuild AND makes API-based
    # workflow_dispatch calls fail with 422. Re-enabling the workflow through
    # the API resets that inactivity timer without pushing a commit (main is
    # protected and rejects direct pushes from GITHUB_TOKEN).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset scheduled workflow inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-publish.yml/enable"
